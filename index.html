<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css" media="(max-width: 768px)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="body">

        <!-- Navbar Start -->
        <nav class="navbar">
            <div class="logo">
                <div class="hamburger">
                    <img src="./assets/hamburger-menu-svgrepo-com.svg" alt="hamburger">
                </div>
                <div>
                    <a href="https://youtube.com" target="_blank" class="youtubelogo" title="YouTube">
                        <img src="./assets/youtube-svgrepo-com.svg" alt="youtube">
                    </a>
                </div>
            </div>
            <div class="search">
                <div class="searchbar">
                    <input type="text" name="search" id="searchinput" placeholder="Search">
                    <img src="./assets/search-alt-svgrepo-com.svg" alt="search logo">
                </div>
                <img src="./assets/mic-svgrepo-com.svg" alt="mic">
            </div>
            <div class="info">
                <button class="createbtn"><img src="./assets/add-svgrepo-com.svg" alt=""> Create</button>
                <button class="notificationbtn n-hide"><img src="./assets/notification-svgrepo-com (1).svg"
                        alt="notification"></button>
                <button class="profilebtn n-hide"><img src="./assets/profile-round-1342-svgrepo-com.svg"
                        alt="profile"></button>
            </div>
        </nav>
        <!-- Navbar End -->
        <div class="contentBox">
            <div class="contentOne">
                <div class="thumbnail">
                    <img src="https://i.ytimg.com/vi/1ztlY12YmwE/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLC_zxSddVfshDDN19j7ABJuNa08DA"
                        alt="video thumbnail">
                </div>
                <div class="cardInfo">
                    <div class="channelLogo">
                        <img src="./assets/profile-round-1342-svgrepo-com.svg" alt="">
                    </div>
                    <div class="videoInfo">
                        <h3 class="videoTitle">This Diet Plan Won me 6 Olympias</h3>
                        <h5 class="channelName">Chris Bumsted</h5>
                        <h5 class="views">1.1M Views • 6 days ago</h5>
                    </div>
                    <div class="threeDots">
                        <img src="./assets/dots-3-vertical-svgrepo-com.svg" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
